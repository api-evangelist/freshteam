actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists - Freshteam's documented public API is
    request/response REST over HTTPS. No AsyncAPI document was created because
    there is no server-push transport on Freshteam's own API to model. The entry
    additionally documents Freshworks' end-of-life of Freshteam honestly, since
    the product is closed to new subscriptions and renewals as of March 7, 2026.
