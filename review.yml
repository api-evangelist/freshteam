aid: freshteam
name: Freshteam
review:
  question: Does Freshteam expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Freshteam's documented public API is a
    request/response REST interface over HTTPS on a per-domain base
    (https://{domain}.freshteam.com/api). There is no documented server-push
    transport (WebSocket or SSE) on Freshteam's own public API to model.
    Freshworks does offer app/webhook mechanisms inside its developer platform,
    but no realtime bidirectional WebSocket surface is published for Freshteam.
findings:
  summary: |
    Freshteam does not publish a documented public WebSocket API. Freshteam is
    the HR and applicant tracking (ATS) product from Freshworks. Its public API
    (developers.freshteam.com/api) is pure request/response REST over HTTPS,
    scoped to an account-specific base https://{domain}.freshteam.com/api and
    authenticated with an account API token passed as a Bearer credential
    (Authorization: Bearer YOUR_API_TOKEN). Resources cover employees, employee
    custom fields, organization structure (branches, departments, sub-departments,
    business units, teams, levels, roles), time-off, job postings, applicants,
    candidate sources, and new hires. List endpoints are paginated (page, sort,
    sort_type) and return total-objects / total-pages / link headers. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented on Freshteam's own API.
  productStatus: |
    IMPORTANT - Freshworks has announced the end-of-life of Freshteam. New
    subscriptions and renewals are halted starting March 7, 2026, and existing
    customers retain access (and thus API access) only through the end of their
    subscription term, reported through approximately April 2027. Freshworks is
    consolidating non-IT team use cases into Freshservice for Business Teams. The
    Freshteam REST API remains documented and usable for current customers during
    this sunset window, but is not available to new signups. This entry documents
    the API honestly as an existing but discontinuing product.
  authModel: |
    A per-account API token generated in the Freshteam UI (profile icon > API
    Settings > Your API Key), sent as Authorization: Bearer YOUR_API_TOKEN.
    Freshworks documents this under an OAuth 2.0 heading, but in practice the
    credential is a long-lived static account key rather than a short-lived
    user-authorized token.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://{domain}.freshteam.com/api
      documented: true
      note: Account-specific REST base for all documented Freshteam endpoints.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Freshteam API reference as of the review date.
  endpointsConfirmedRest:
    - GET    https://{domain}.freshteam.com/api/employees
