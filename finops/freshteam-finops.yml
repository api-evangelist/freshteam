meters:
- name: subscribed_employees
  description: Number of subscribed employees, the primary per-employee-per-month billing metric.
  unit: employees
  aggregation: max
  dimensions:
  - account
  - plan
- name: platform_fee
  description: Flat monthly platform fee applied on paid tiers regardless of headcount.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: api_requests
  description: API request volume against per-minute rate limits; included in the subscription, not billed separately.
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track subscribed-employee counts and platform fees per account; API usage is not a separate billed line.
- name: Allocation
  description: Map Freshteam cost to HR/recruiting cost centers by headcount and plan tier.
- name: Optimization
  description: With renewals closed, optimize by planning an orderly migration off Freshteam and exporting data before term end rather than tuning ongoing spend.
- name: Accountability
  description: Assign an owner for the Freshteam wind-down and migration timeline ahead of the end-of-life deadline.
