description: >-
  FinOps view of Freshteam spend. Freshteam was billed on a per-employee-per-month
  basis plus a flat monthly platform fee on paid tiers (Growth, Pro, Enterprise),
  with the API included in the subscription rather than metered separately. The
  primary cost driver was headcount (subscribed employees), not API call volume.
  A critical governance note - Freshworks has announced the end-of-life of
  Freshteam - new subscriptions and renewals are halted from March 7, 2026, and
  existing customers retain access only through their remaining term (reported
  through approximately April 2027). Cost planning should therefore center on
  migration off Freshteam rather than on ongoing optimization.
notes: >-
  Because renewals are closed, the dominant FinOps activity is exit planning -
  data export, contract wind-down, and re-platforming HR/ATS workloads (Freshworks
  is steering non-IT teams toward Freshservice for Business Teams). Verify any
  surviving contractual rate directly with Freshworks.
