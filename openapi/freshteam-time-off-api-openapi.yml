openapi: 3.2.0
info:
  title: Freshteam Time Off API
  description: The Freshteam API is the REST interface to Freshworks' HR and applicant tracking (ATS) product.
  version: '1.0'
  contact:
    name: Freshworks - Freshteam
    url: https://developers.freshteam.com/api/
servers:
- url: https://{domain}.freshteam.com/api
  description: Account-specific Freshteam API base
  variables:
    domain:
      default: your-account
      description: Your Freshteam account subdomain.
security:
- bearerAuth: []
tags:
- name: Time Off
  description: Time-off (leave) requests and types.
paths:
  /time_offs:
    get:
      operationId: listTimeOffs
      tags:
      - Time Off
      summary: List time-off requests
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of time-off requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeOff'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTimeOff
      tags:
      - Time Off
      summary: Create a time-off request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOff'
      responses:
        '201':
          description: The created time-off request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /time_offs/{id}:
    get:
      operationId: getTimeOff
      tags:
      - Time Off
      summary: Retrieve a time-off request
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The requested time-off request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '404':
          $ref: '#/components/responses/NotFound'
  /time_offs/{id}/approve:
    put:
      operationId: approveTimeOff
      tags:
      - Time Off
      summary: Approve a time-off request
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The approved time-off request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /time_offs/{id}/cancel:
    put:
      operationId: cancelTimeOff
      tags:
      - Time Off
      summary: Cancel a time-off request
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The cancelled time-off request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOff'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /time_off_types:
    get:
      operationId: listTimeOffTypes
      tags:
      - Time Off
      summary: List time-off types
      responses:
        '200':
          description: A list of time-off types.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    TimeOff:
      type: object
      properties:
        id:
          type: integer
          format: int64
        applicant_id:
          type: integer
          format: int64
        leave_type_id:
          type: integer
          format: int64
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
        reason:
          type: string
  responses:
    NotFound:
      description: The requested resource was not found.
    Unauthorized:
      description: Authentication failed or the API token is missing or invalid.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: The resource identifier.
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated list results (default 1).
      schema:
        type: integer
        default: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Account API token generated in the Freshteam UI under API Settings, passed as Authorization: Bearer YOUR_API_TOKEN.'
