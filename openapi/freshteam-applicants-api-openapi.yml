openapi: 3.2.0
info:
  title: Freshteam Applicants API
  description: The Freshteam API is the REST interface to Freshworks' HR and applicant tracking (ATS) product.
  version: '1.0'
  contact:
    name: Freshworks - Freshteam
    url: https://developers.freshteam.com/api/
servers:
- url: https://{domain}.freshteam.com/api
  description: Account-specific Freshteam API base
  variables:
    domain:
      default: your-account
      description: Your Freshteam account subdomain.
security:
- bearerAuth: []
tags:
- name: Applicants
  description: Applicants (candidates) and candidate sources (ATS).
paths:
  /job_postings/{id}/applicants:
    post:
      operationId: createApplicant
      tags:
      - Applicants
      summary: Create an applicant for a job posting
      description: Adds an applicant (candidate) to the specified job posting.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Applicant'
      responses:
        '201':
          description: The created applicant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applicant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /candidate_sources:
    get:
      operationId: listCandidateSources
      tags:
      - Applicants
      summary: List candidate sources
      responses:
        '200':
          description: A list of candidate sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCandidateSource
      tags:
      - Applicants
      summary: Create a candidate source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: The created candidate source.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        source_id:
          type: integer
          format: int64
        resume:
          type: string
          description: URL or base64 payload of the candidate resume.
  responses:
    Unauthorized:
      description: Authentication failed or the API token is missing or invalid.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: The resource identifier.
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Account API token generated in the Freshteam UI under API Settings, passed as Authorization: Bearer YOUR_API_TOKEN.'
