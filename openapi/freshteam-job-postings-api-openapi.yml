openapi: 3.2.0
info:
  title: Freshteam Job Postings API
  description: The Freshteam API is the REST interface to Freshworks' HR and applicant tracking (ATS) product.
  version: '1.0'
  contact:
    name: Freshworks - Freshteam
    url: https://developers.freshteam.com/api/
servers:
- url: https://{domain}.freshteam.com/api
  description: Account-specific Freshteam API base
  variables:
    domain:
      default: your-account
      description: Your Freshteam account subdomain.
security:
- bearerAuth: []
tags:
- name: Job Postings
  description: Job postings and their custom fields (recruiting).
paths:
  /job_postings:
    get:
      operationId: listJobPostings
      tags:
      - Job Postings
      summary: List job postings
      parameters:
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A list of job postings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPosting'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /job_postings/{id}:
    get:
      operationId: getJobPosting
      tags:
      - Job Postings
      summary: Retrieve a job posting
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The requested job posting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          $ref: '#/components/responses/NotFound'
  /job_posting_fields:
    get:
      operationId: listJobPostingFields
      tags:
      - Job Postings
      summary: List job posting fields
      responses:
        '200':
          description: A list of job posting fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    JobPosting:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        type:
          type: string
        remote:
          type: boolean
        description:
          type: string
        branch_id:
          type: integer
          format: int64
        department_id:
          type: integer
          format: int64
  responses:
    NotFound:
      description: The requested resource was not found.
    Unauthorized:
      description: Authentication failed or the API token is missing or invalid.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: The resource identifier.
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: Page number for paginated list results (default 1).
      schema:
        type: integer
        default: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Account API token generated in the Freshteam UI under API Settings, passed as Authorization: Bearer YOUR_API_TOKEN.'
