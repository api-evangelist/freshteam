    name: pro_platform_fee
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: '99'
    userMultiplied: false
  - label: Per Employee
    name: pro_per_employee
    type: usage
    metric: employees
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: '2.00'
    userMultiplied: true
  elements:
  - name: Candidate Sourcing Extension
  - name: Job Requisitions
  - name: Offer Management
  - name: Up to 100 Job Postings
- id: freshteam-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    IP restrictions, dedicated account manager, unlimited onboarding checklists,
    and unlimited job postings, billed per employee plus a monthly platform fee.
  entries:
