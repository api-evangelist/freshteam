name: Freshteam
kind: company
description: Freshteam is the HR and applicant tracking (ATS) product from Freshworks,
  covering recruiting, applicant tracking, employee information management (HRIS),
  onboarding, and time-off. It exposes a documented REST API on a per-domain base
  (https://{domain}.freshteam.com/api) with token auth over Employees, Job Postings,
  Applicants, Interviews, Time-off, and organization structure (Departments, Branches,
  Teams). IMPORTANT STATUS - Freshworks has announced the end-of-life of Freshteam -
  new subscriptions and renewals are halted starting March 7, 2026, and existing
  customers retain access only through the end of their term (reported through
  approximately April 2027). This entry documents the API honestly as an existing
  but sunsetting product; the API remains usable for current customers during the
  transition but is not available to new signups.
